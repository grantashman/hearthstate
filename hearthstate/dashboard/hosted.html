<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ede3">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=hearthstate-3">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <title>Hearthstate · Set up your household</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f0e8; color: #26231f; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #fffaf0, #f4f0e8 48%); }
    main { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { margin-bottom: 28px; }
    h1, h2, p { margin-top: 0; } h1 { font-size: clamp(2rem, 5vw, 3.8rem); letter-spacing: -.06em; margin-bottom: 8px; }
    h2 { font-size: 1.15rem; letter-spacing: -.02em; } p { color: #6c655c; line-height: 1.55; }
    .eyebrow { color: #a24b2a; text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 800; }
    .card { background: rgba(255,255,255,.78); border: 1px solid #e4dbce; border-radius: 22px; box-shadow: 0 18px 60px rgba(74, 54, 28, .08); padding: 24px; }
    label { display: block; color: #6c655c; font-size: .84rem; font-weight: 700; margin-bottom: 7px; }
    input, button { box-sizing: border-box; width: 100%; font: inherit; border-radius: 12px; border: 1px solid #d8cbbb; padding: 11px 13px; }
    input { background: #fffdf9; color: #26231f; } button { cursor: pointer; background: #a24b2a; border-color: #a24b2a; color: white; font-weight: 750; margin-top: 12px; }
    .muted { color: #8b8175; font-size: .88rem; } .error { color: #a83232; min-height: 1.3em; } .success { color: #39704d; min-height: 1.3em; }
    @media (max-width: 640px) { main { padding-top: 28px; } .card { padding: 18px; border-radius: 17px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Household operations</div>
    <h1>Set up Hearthstate</h1>
    <p id="identity">Create the household that will hold your shared tasks, calendar, meals, groceries, and inbox.</p>
  </header>
  <section class="card">
    <h2>Create your household</h2>
    <p>This creates your first owner membership. Other members can be invited from the hosted administration flow.</p>
    <form id="household-form">
      <label for="household-name">Household name</label>
      <input id="household-name" name="name" required maxlength="120" autocomplete="organization" placeholder="The Ashman Home">
      <button type="submit">Create household</button>
    </form>
    <p id="message" class="error" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
(() => {
  const form = document.querySelector('#household-form');
  const nameInput = document.querySelector('#household-name');
  const identity = document.querySelector('#identity');
  const message = document.querySelector('#message');
  const setMessage = (text, error = true) => { message.textContent = text; message.className = error ? 'error' : 'success'; };
  async function loadSession() {
    const response = await fetch('/api/me', { cache: 'no-store', credentials: 'same-origin' });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || 'Your session has expired.');
    if (payload.households?.length) { window.location.assign('/'); return false; }
    identity.textContent = payload.user?.email ? `Signed in as ${payload.user.email}. Create the household for this account.` : 'Create the household for this signed-in account.';
    return true;
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    setMessage('Creating household…', false);
    try {
      const response = await fetch('/api/households', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ name: nameInput.value.trim() }) });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Could not create household.');
      window.location.assign('/');
    } catch (error) {
      setMessage(error.message);
      button.disabled = false;
    }
  });
  loadSession().catch((error) => { setMessage(error.message); window.setTimeout(() => window.location.assign('/login'), 900); });
})();
</script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
