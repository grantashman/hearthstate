name: Hearthstate Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: hearthstate-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: zcfzdqtjglelrbyhcvcu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect committed Supabase migrations
        id: migration_changes
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$EVENT_BEFORE" "$GITHUB_SHA" -- supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for connected Vercel deployment
        if: steps.migration_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });
              const vercel = statuses.find((status) => /vercel/i.test(status.context));
              if (vercel?.state === 'success') return;
              if (vercel && ['error', 'failure'].includes(vercel.state)) {
                throw new Error(`Vercel deployment failed: ${vercel.description || vercel.context}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            throw new Error('Timed out waiting for the connected Vercel deployment for this commit');

      - name: Install Supabase CLI
        if: steps.migration_changes.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Apply committed Supabase migrations
        if: steps.migration_changes.outputs.changed == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

      - name: Confirm Vercel deployment ownership
        run: echo "Vercel deploys main through the connected Git integration."
